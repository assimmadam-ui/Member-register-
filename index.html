<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>മഠത്തിൽ ബദർ ജമാഅത്ത് രജിസ്ട്രേഷൻ</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f0f2f5;margin:0;padding:16px;color:#1a1a1a}
.wrap{max-width:600px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
h2{color:#0b5c3d;margin-top:0;font-size:22px;text-align:center}
p.desc{color:#555;font-size:14px;text-align:center;margin-bottom:24px;line-height:1.5}
.form-group{margin-bottom:18px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;color:#333}
input, select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px;outline:none;background:#fafafa}
input:focus, select:focus{border-color:#0b5c3d;background:#fff;box-shadow:0 0 0 3px rgba(11,92,61,0.1)}
button{width:100%;background:#0b5c3d;color:#fff;border:none;padding:16px;font-size:16px;font-weight:700;border-radius:10px;cursor:pointer;margin-top:10px}
button:hover{background:#094830}
.success-msg{display:none;background:#e7f7ed;color:#0b5c3d;padding:16px;border-radius:10px;text-align:center;font-weight:600;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
<h2>യുഎഇ മഠത്തിൽ ബദർ ജമാഅത്ത് വാട്‌സ്ആപ്പ് ഗ്രൂപ്പ് രജിസ്ട്രേഷൻ</h2>
<p class="desc">പ്രിയപ്പെട്ടവരെ, യുഎഇയിലുള്ള മഠത്തിൽ ജമാഅത്ത് അംഗങ്ങളെ ഉൾപ്പെടുത്തി പുതിയ വാട്‌സ്ആപ്പ് ഗ്രൂപ്പ് രൂപീകരിക്കുന്നതിന്റെ ഭാഗമായി വിവരങ്ങൾ ശേഖരിക്കാൻ തയ്യാറാക്കിയ ഫോമാണിത്.</p>

<form id="regForm">
  <div class="form-group">
    <label>പൂർണ്ണമായ പേര് (Full Name)</label>
    <input type="text" id="fullName" required placeholder="നിങ്ങളുടെ പേര് നൽകുക">
  </div>

  <div class="form-group">
    <label>പിതാവിന്റെ പേര് (Father's Name)</label>
    <input type="text" id="fatherName" required placeholder="പിതാവിന്റെ പേര് നൽകുക">
  </div>

  <div class="form-group">
    <label>യുഎഇയിൽ നിലവിലുള്ള സ്ഥലം / എമിറേറ്റ്സ് (Emirate in UAE)</label>
    <select id="emirate" required>
      <option value="">എമിറേറ്റ്സ് തിരഞ്ഞെടുക്കുക</option>
      <option value="ദുബൈ">ദുബൈ (Dubai)</option>
      <option value="ഷാർജ">ഷാർജ (Sharjah)</option>
      <option value="അബുദാബി">അബുദാബി (Abu Dhabi)</option>
      <option value="അജ്‌മാൻ">അജ്‌മാൻ (Ajman)</option>
      <option value="റാസൽഖൈമ">റാസൽഖൈമ (Ras Al Khaimah)</option>
      <option value="ഉമ്മുൽ ഖുവൈൻ">ഉമ്മുൽ ഖുവൈൻ (Umm Al Quwain)</option>
      <option value="ഫുജൈറ">ഫുജൈറ (Fujairah)</option>
    </select>
  </div>

  <div class="form-group">
    <label>യുഎഇ മൊബൈൽ നമ്പർ (UAE Mobile Number)</label>
    <input type="tel" id="mobile" required placeholder="+971 5XXXXXXXX">
  </div>

  <div class="form-group">
    <label>വാട്‌സ്ആപ്പ് നമ്പർ (WhatsApp Number)</label>
    <input type="tel" id="whatsapp" required placeholder="+971 5XXXXXXXX">
  </div>

  <button type="submit">റെജിസ്റ്റർ ചെയ്യുക</button>
</form>

<div id="successBox" class="success-msg">
  നന്ദി! നിങ്ങളുടെ വിവരങ്ങൾ വിജയകരമായി സമർപ്പിച്ചിരിക്കുന്നു.
</div>

</div>

<script>
document.getElementById('regForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const name = document.getElementById('fullName').value;
  const father = document.getElementById('fatherName').value;
  const emirate = document.getElementById('emirate').value;
  const mobile = document.getElementById('mobile').value;
  const whatsapp = document.getElementById('whatsapp').value;

  document.getElementById('regForm').style.display = 'none';
  document.getElementById('successBox').style.display = 'block';
});
</script>
</body>
</html>
